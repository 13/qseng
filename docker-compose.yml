services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qseng
      POSTGRES_USER: qseng
      POSTGRES_PASSWORD: qseng
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qseng"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/13/qseng-api:${QSENG_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DB_PROVIDER: postgres
      CONNECTION_STRING: "Host=postgres;Database=qseng;Username=qseng;Password=qseng"
      Jwt__Issuer: qseng
      Jwt__Audience: qseng
      # Interpolated so `export Jwt__Key=...` (or a .env file) overrides the placeholder; a literal
      # value here would win over the host environment and the override could never take effect.
      Jwt__Key: "${Jwt__Key:-change-me-in-prod-please-32+chars-long-key!}"
      Cors__AllowedOrigins__0: "http://localhost:8081"
      Uploads__Path: /app/uploads
      ForwardedHeaders__KnownNetworks__0: "172.28.0.0/16"
    depends_on:
      postgres:
        condition: service_healthy
    # nginx (the frontend service) proxies /api/ and /uploads/, so the api container
    # need not publish a host port. Uncomment for local debugging only:
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    image: ghcr.io/13/qseng-web:${QSENG_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  pgdata:
  uploads:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
