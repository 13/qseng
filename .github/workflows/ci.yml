name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore backend/Qseng.slnx
      - run: dotnet build backend/Qseng.slnx --configuration Release --no-restore
      - run: dotnet test backend/Qseng.slnx --configuration Release --no-build
      - run: dotnet publish backend/src/Qseng.Api -c Release -o out/api --no-build
      - uses: actions/upload-artifact@v7
        with: { name: api, path: out/api }
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run gates
      - run: npx ng lint
      - run: npm run e2e:lint
      - run: npx ng test --watch=false --coverage
      - shell: bash
        run: |
          set -o pipefail
          npx ng build 2>&1 | tee build.log
          ! grep -E "exceeded maximum budget" build.log
      - uses: actions/upload-artifact@v7
        with: { name: web, path: frontend/dist/frontend/browser }
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: bash backend/export-openapi.sh
      - run: git diff --exit-code -- contracts/openapi.json
      - run: npm ci && npm run gen:api && npx ng build
        working-directory: frontend
  # Only needs backend: the api artifact is downloaded and run below. The e2e suite serves the
  # frontend itself via `npm start` (see e2e/playwright.config.ts's webServer) from this job's own
  # checkout — it never consumes the frontend job's build artifact, so depending on that job only
  # serialised the pipeline without buying anything (Minor 5).
  e2e:
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/download-artifact@v8
        with: { name: api, path: out/api }
      - run: npm ci
      # Caching ~/.cache/ms-playwright keyed on the Playwright version (via the lockfile hash)
      # turns the Chromium download in the install step below into a cache hit on repeat runs;
      # the --with-deps OS package install still runs every time (Minor 7).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_API_CMD: "dotnet ${{ github.workspace }}/out/api/Qseng.Api.dll"
          # dotnet <dll> resolves appsettings.json against the process's current directory, not the
          # dll's own folder — without this the published API can't find Jwt/Uploads/RateLimiting
          # defaults from out/api/appsettings.json and fails OptionsValidationException at startup.
          ASPNETCORE_CONTENTROOT: "${{ github.workspace }}/out/api"
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
  # Builds both images on every run; pushes to ghcr.io (edge on main, semver on v* tags) only on
  # push events and only after every check job is green. PR runs never log in or push.
  images:
    needs: [backend, frontend, contract, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix: { image: [api, web] }
    steps:
      - uses: actions/checkout@v7
      - id: inputs
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=ghcr.io/${owner,,}/qseng-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::tag must look like vX.Y.Z or vX.Y.Z-pre"
                exit 1
              fi
              version="${GITHUB_REF_NAME#v}"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              case "$version" in
                *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
                *)   echo "stable=true" >> "$GITHUB_OUTPUT" ;;
              esac
              ;;
            refs/heads/main)
              echo "version=0.0.0-edge" >> "$GITHUB_OUTPUT"
              echo "stable=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=0.0.0-pr" >> "$GITHUB_OUTPUT"
              echo "stable=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.inputs.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Qseng ${{ matrix.image }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QSENG_VERSION=${{ steps.inputs.outputs.version }}
            QSENG_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.inputs.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.inputs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: github.event_name == 'push'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.inputs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '%s@%s\n' "${{ steps.inputs.outputs.image }}" "${{ steps.build.outputs.digest }}" > image-${{ matrix.image }}.txt
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with: { name: "image-${{ matrix.image }}", path: "image-${{ matrix.image }}.txt" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "image-*", merge-multiple: true, path: images }
      - shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}", OWNER: "${{ github.repository_owner }}" }
        run: |
          v="${TAG#v}"
          owner_lc="${OWNER,,}"
          {
            echo "## Images"
            echo
            for f in images/image-*.txt; do echo "- \`$(cat "$f")\`"; done
            echo
            echo "Verify provenance and SBOM:"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${owner_lc}/qseng-api:$v --owner ${owner_lc}"
            echo "gh attestation verify oci://ghcr.io/${owner_lc}/qseng-web:$v --owner ${owner_lc}"
            echo '```'
          } > images.md
          # Fetch GitHub's generated notes ourselves (instead of `--generate-notes`) so a re-run of
          # the same tag can rebuild the identical body via `gh release edit` without wiping it —
          # `gh release edit` has no `--generate-notes` flag. Same body, same order, on both the
          # create and edit paths: generated notes first, then the Images block.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > generated.md
          { cat generated.md; echo; cat images.md; } > body.md
          case "$v" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md --prerelease="$prerelease"
          else
            create_flags=(--verify-tag --notes-file body.md)
            [ "$prerelease" = true ] && create_flags+=(--prerelease)
            gh release create "$TAG" "${create_flags[@]}"
          fi
